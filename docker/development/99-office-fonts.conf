<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Keep installed originals preferred. Use substitutes with similar metrics
       for common Office families rather than a generic sans/serif fallback. -->
  <alias binding="same">
    <family>Calibri Light</family>
    <accept><family>Carlito</family></accept>
  </alias>
  <alias binding="same">
    <family>Arial Narrow</family>
    <accept><family>Liberation Sans Narrow</family></accept>
  </alias>
  <alias binding="same">
    <family>Book Antiqua</family>
    <accept><family>TeX Gyre Pagella</family></accept>
  </alias>
  <alias binding="same">
    <family>Palatino Linotype</family>
    <accept><family>TeX Gyre Pagella</family></accept>
  </alias>
  <alias binding="same">
    <family>Century Schoolbook</family>
    <accept><family>TeX Gyre Schola</family></accept>
  </alias>
  <alias binding="same">
    <family>Bookman Old Style</family>
    <accept><family>TeX Gyre Bonum</family></accept>
  </alias>
</fontconfig>
